[project]
name = "ai-programming-partner"
version = "0.1.0"
description = "Local-first, review-first AI programming partner (learning project)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.121.0",
    "requests>=2.34.2",
    "langchain-core>=1.6.2",
    "psycopg[binary]>=3.3.5",
    "pgvector>=0.5.0",
    "langgraph==1.2.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
